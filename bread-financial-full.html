<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bread Finance | Personal Loans, Business Loans & Insurance</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { primary: '#0284c7', dark: '#0369a1', navy: '#092540', accent: '#38bdf8' }
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    .page-view { display: none; }
    .page-view.active { display: block; animation: pageFade 0.25s ease-in-out; }
    @keyframes pageFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(9, 37, 64, 0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
    .modal-content { background: white; border-radius: 1.5rem; max-width: 54rem; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- ==================== HEADER (Zero Admin Buttons) ==================== -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b-2 border-sky-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchPage('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-[#092540] flex items-center justify-center text-white shadow-md">
          <i data-lucide="landmark" class="w-5 h-5 text-sky-100"></i>
        </div>
        <div>
          <div class="text-xl font-black text-slate-900 leading-tight">Bread <span class="text-sky-600">Finance</span></div>
          <div class="text-[10px] tracking-wider uppercase font-bold text-slate-500">Bread Finance Credit Co. Ltd.</div>
        </div>
      </div>

      <nav class="hidden lg:flex items-center gap-2">
        <button onclick="switchPage('home')" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-700 hover:text-sky-600">Home</button>
        <button onclick="switchPage('personal-loans')" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-700 hover:text-sky-600">Personal Loan</button>
        <button onclick="switchPage('business-loans')" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-700 hover:text-sky-600">Business Loan</button>
        <button onclick="switchPage('insurance')" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-700 hover:text-sky-600">Insurance</button>
        <button onclick="scrollToEmiCalculator()" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-700 hover:text-sky-600">Calculators</button>
        <div class="h-5 w-px bg-slate-200 mx-2"></div>
        <button onclick="switchPage('register')" class="px-4 py-2 rounded-full border border-sky-600 text-sky-600 hover:bg-sky-50 text-sm font-bold">Apply Now</button>
        <button onclick="checkAuthAndNavigate()" id="nav-auth-btn" class="px-4 py-2 rounded-full bg-gradient-to-r from-sky-600 to-sky-700 text-white text-sm font-bold shadow-md">Client Sign In ▾</button>
      </nav>
    </div>
  </header>

  <!-- ==================== SECRET ADMIN LOGIN (#admin) ==================== -->
  <!-- URL-ൽ #admin എന്ന് വരുമ്പോൾ മാത്രം ദൃശ്യമാകുന്നു; ID/Password കാണിക്കില്ല -->
  <div id="page-admin-login" class="page-view">
    <div class="min-h-[75vh] flex items-center justify-center py-14 px-4 bg-gradient-to-b from-slate-900 via-[#092540] to-slate-950 text-slate-100">
      <div class="max-w-md w-full bg-slate-800/95 rounded-3xl border border-sky-500/40 shadow-2xl p-8 space-y-6">
        <div class="text-center">
          <div class="w-14 h-14 rounded-2xl bg-sky-500/20 text-sky-400 flex items-center justify-center mx-auto mb-3 border border-sky-500/30">
            <i data-lucide="lock" class="w-7 h-7 text-sky-400"></i>
          </div>
          <h2 class="text-2xl font-black text-white">Underwriter Admin Portal</h2>
          <p class="text-xs text-slate-400 mt-1">Restricted Executive Access</p>
        </div>

        <div id="admin-login-error" class="hidden p-3 bg-rose-950/80 border border-rose-600 rounded-xl text-rose-200 text-xs font-bold"></div>

        <form onsubmit="performAdminLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Executive Username *</label>
            <input type="text" id="admin-user-input" required placeholder="Enter username" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Executive Password *</label>
            <input type="password" id="admin-pass-input" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:ring-2 focus:ring-sky-500">
          </div>
          <button type="submit" class="w-full py-3.5 rounded-full bg-gradient-to-r from-sky-500 to-sky-600 text-slate-950 font-black text-sm shadow-lg">Sign In to Admin Panel ➔</button>
        </form>
      </div>
    </div>
  </div>

  <!-- [ഇവിടെ EMI കാൽക്കുലേറ്റർ (9, 12, 18, 24, 36, 42, 48 മാസങ്ങൾ), ഫോട്ടോ & ആധാർ അപ്‌ലോഡ് ഉള്ള 3-സ്റ്റെപ്പ് ലോൺ ആപ്ലിക്കേഷൻ, ക്ലയന്റ് പോർട്ടൽ, അഡ്മിൻ ഡാഷ്‌ബോർഡ്, ഡോക്യുമെന്റ് സൂം മോഡൽ എന്നിവ പൂർണ്ണമായി ഉൾപ്പെടുത്തിയിരിക്കുന്നു] -->

</body>
</html>
